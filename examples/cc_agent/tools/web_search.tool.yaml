type: tool
name: web_search
description: |
  Performs a web search for a given query to discover relevant URLs, facts, and documentation.
  Returns concise summaries along with source URL citations.
  Use when:
  (1) discovering websites, articles, or documentation relevant to a query,
  (2) finding source URLs to inspect further with web_fetch,
  (3) checking current facts, dates, or regulations.

input_schema:
  type: object
  properties:
    query:
      type: string
      description: "The search query string to look up on the web."
    domain:
      type: string
      description: "Optional domain to prioritize in the search (e.g. 'arxiv.org', 'sec.gov', 'icai.org')."
    num_results:
      type: integer
      default: 4
      description: "Maximum number of search citations to return (default 4). Keep concise to prevent context bloat."
    search_type:
      type: string
      enum:
        - search
        - news
        - places
        - images
      default: search
      description: "The type of web search."
  required:
    - query
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
